name: Prepare PlayStatus Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated vX.Y.Z tag to retry
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Keep release artifacts linked against Xcode 26's current macOS SDK.
    # MACOSX_DEPLOYMENT_TARGET remains 15.0 in the Xcode project.
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A manual retry runs the current workflow code from the selected branch;
          # `release_tag` is validated separately by release-build.sh.
          ref: ${{ github.ref }}

      - name: Write Last.fm credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
        run: |
          set -euo pipefail
          # PlayStatus/Secrets.plist is gitignored, so the checkout never contains it. Without
          # this step a release would ship with scrobbling permanently unavailable — hence the
          # explicit check rather than letting an empty value through silently.
          if [ -z "${LASTFM_API_KEY}" ] || [ -z "${LASTFM_SHARED_SECRET}" ]; then
            echo "::error::Missing LASTFM_API_KEY and/or LASTFM_SHARED_SECRET. Add them as secrets on the 'release' environment (Settings -> Secrets and variables -> Actions -> Manage environment secrets -> release), alongside the signing and notarization secrets."
            exit 1
          fi
          # The file is gitignored, so it does not exist in the checkout and PlistBuddy has
          # nothing to open. Create an empty plist first, then add the keys — PlistBuddy
          # handles XML escaping, which a heredoc would not.
          cat > PlayStatus/Secrets.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          PLIST
          sed -i '' 's/^          //' PlayStatus/Secrets.plist
          /usr/libexec/PlistBuddy \
            -c "Add :LastFMAPIKey string ${LASTFM_API_KEY}" \
            -c "Add :LastFMSharedSecret string ${LASTFM_SHARED_SECRET}" \
            PlayStatus/Secrets.plist
          plutil -lint PlayStatus/Secrets.plist
          # Confirm both keys are non-empty without ever printing them.
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :LastFMAPIKey' PlayStatus/Secrets.plist)"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :LastFMSharedSecret' PlayStatus/Secrets.plist)"
          echo "Secrets.plist written and verified."

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/playstatus-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          APPLE_DEVELOPER_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          test -n "$APPLE_DEVELOPER_IDENTITY"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "APPLE_DEVELOPER_IDENTITY=$APPLE_DEVELOPER_IDENTITY" >> "$GITHUB_ENV"

      - name: Configure notarization credentials
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APPSTORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials playstatus-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"

      - name: Build, notarize, and verify release
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_PROFILE: playstatus-notary
          DERIVED_DATA_PATH: ${{ runner.temp }}/PlayStatusDerivedData
          ARCHIVE_PATH: ${{ runner.temp }}/PlayStatus.xcarchive
          DIST_DIR: ${{ runner.temp }}/PlayStatus-dist
        run: scripts/release-build.sh

      - name: Create or replace the GitHub Release build asset
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ASSET: ${{ steps.package.outputs.asset_path }}
          BUILD_NUMBER: ${{ steps.package.outputs.build_number }}
        run: |
          set -euo pipefail
          ASSET_NAME="$(basename "$RELEASE_ASSET")"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Build-qualified payload names prevent an updated build from sharing
            # the immutable cache key of an earlier payload with the same
            # marketing version. Keep only the current release archive.
            while IFS= read -r existing_asset; do
              case "$existing_asset" in
                "PlayStatus-${RELEASE_TAG#v}.zip"|"PlayStatus-${RELEASE_TAG#v}-build"*.zip)
                  gh release delete-asset "$RELEASE_TAG" "$existing_asset" --yes
                  ;;
              esac
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "$RELEASE_ASSET" --clobber
            gh release edit "$RELEASE_TAG" --title "PlayStatus ${RELEASE_TAG#v} (Build $BUILD_NUMBER)"
          else
            gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
              --verify-tag \
              --title "PlayStatus ${RELEASE_TAG#v} (Build $BUILD_NUMBER)" \
              --notes-from-tag \
              --draft
          fi

          PUBLISHED_ASSET_DIR="$RUNNER_TEMP/published-release-asset"
          mkdir -p "$PUBLISHED_ASSET_DIR"
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --dir "$PUBLISHED_ASSET_DIR"
          PUBLISHED_ASSET="$PUBLISHED_ASSET_DIR/$ASSET_NAME"
          test -f "$PUBLISHED_ASSET"
          echo "asset_path=$PUBLISHED_ASSET" >> "$GITHUB_OUTPUT"
          echo "Release asset ready: $(gh release view "$RELEASE_TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
